<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VW Melrose — Agent desk</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-chat: #efeae2;
      --panel: #ffffff;
      --line: #e9edef;
      --line-soft: #f0f2f5;
      --text: #111b21;
      --muted: #667781;
      --green: #25d366;
      --green-dark: #1da851;
      --green-deep: #128c7e;
      --bubble-in: #ffffff;
      --bubble-out: #d9fdd3;
      --bubble-bot: #fff8c5;
      --danger: #ea4335;
      --shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
    }
    .hidden { display: none !important; }

    /* —— Login —— */
    #login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37, 211, 102, 0.12), transparent 55%),
        #ffffff;
    }
    .card {
      width: min(400px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(11, 20, 26, 0.06);
    }
    .card h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .card p { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; line-height: 1.4; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type="password"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 12px 14px;
      font: inherit;
      outline: none;
    }
    input[type="password"]:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(37, 211, 102, 0.2);
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--green);
      color: #fff;
    }
    button:hover:not(:disabled) { background: var(--green-dark); }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.secondary:hover:not(:disabled) { background: var(--line-soft); }
    button.danger { background: var(--danger); }
    button.danger:hover:not(:disabled) { filter: brightness(0.95); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .error { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
    .banner {
      margin: 0;
      padding: 10px 14px;
      background: #fff4e5;
      color: #7a4b00;
      border-bottom: 1px solid #f0d9a8;
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .banner.danger {
      background: #fdecea;
      color: #8a1f11;
      border-bottom-color: #f5c6c0;
    }

    /* —— App shell —— */
    #app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: 360px 1fr;
      background: var(--bg);
      overflow: hidden;
    }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }

    /* Header modeled on screenshot: Chats | ⋮ | green + */
    .aside-head, .thread-head {
      padding: 12px 14px 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      min-height: 60px;
    }
    .aside-head h2, .thread-head h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      color: #54656f;
      display: inline-grid;
      place-items: center;
      border: 0;
    }
    .icon-btn:hover:not(:disabled) { background: var(--line-soft); }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .fab {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      display: inline-grid;
      place-items: center;
      box-shadow: none;
    }
    .fab:hover:not(:disabled) { background: var(--green-dark); }
    .fab svg { width: 22px; height: 22px; fill: currentColor; }

    .menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 160px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(11, 20, 26, 0.12);
      padding: 6px 0;
      z-index: 20;
    }
    .menu button {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text);
      font-weight: 500;
      border-radius: 0;
      padding: 10px 16px;
    }
    .menu button:hover:not(:disabled) { background: var(--line-soft); }

    #chatList {
      overflow: auto;
      flex: 1;
      background: #fff;
    }
    .chat-item {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      padding: 12px 16px;
      font-weight: 500;
      display: block;
    }
    .chat-item:hover { background: #f5f6f6; }
    .chat-item.active { background: #e7f8ef; }
    .chat-item .wa {
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chat-item .preview {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
      font-weight: 400;
    }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e9edef;
      color: var(--muted);
      font-weight: 600;
      text-transform: lowercase;
    }
    .badge.takeover { background: rgba(37, 211, 102, 0.18); color: var(--green-deep); }
    .badge.quiet { background: #e7f3ff; color: #027eb5; }

    main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      background: var(--bg-chat);
      background-image:
        linear-gradient(rgba(255,255,255,0.72), rgba(255,255,255,0.72)),
        radial-gradient(circle at 20% 20%, rgba(37, 211, 102, 0.05) 0, transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(18, 140, 126, 0.06) 0, transparent 45%);
    }
    .thread-head {
      background: #fff;
      flex-shrink: 0;
    }
    .thread-head .sub {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 2px;
      font-weight: 400;
    }
    #messages {
      flex: 1;
      overflow: auto;
      padding: 16px 5%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-width: 320px;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .bubble {
      max-width: min(520px, 85%);
      padding: 8px 10px 6px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
      line-height: 1.4;
      box-shadow: var(--shadow);
      position: relative;
    }
    .bubble.in {
      align-self: flex-start;
      background: var(--bubble-in);
      border-top-left-radius: 0;
    }
    .bubble.out-bot {
      align-self: flex-end;
      background: var(--bubble-bot);
      border-top-right-radius: 0;
    }
    .bubble.out-agent {
      align-self: flex-end;
      background: var(--bubble-out);
      border-top-right-radius: 0;
    }
    .meta {
      display: block;
      margin-top: 4px;
      font-size: 0.68rem;
      color: var(--muted);
      text-align: right;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      background: #f0f2f5;
      flex-shrink: 0;
    }
    .composer textarea {
      border-radius: 22px;
      border-color: transparent;
      padding: 12px 16px;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }
    .composer-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .composer-actions .grow { margin-left: auto; border-radius: 22px; padding: 10px 20px; }
  </style>
</head>
<body>
  <section id="login">
    <form class="card" id="loginForm">
      <h1>VW Melrose agent desk</h1>
      <p>Staff access to Cloud API chats. After Take over or Send, the bot stays quiet until you Release to bot.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <div style="margin-top:16px; display:flex; gap:8px;">
        <button type="submit">Sign in</button>
      </div>
      <div class="error" id="loginError"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <aside>
      <div class="aside-head">
        <h2>Chats</h2>
        <div class="head-actions">
          <button type="button" class="icon-btn" id="menuBtn" aria-label="Menu" title="Menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </button>
          <button type="button" class="fab" id="refreshBtn" aria-label="Refresh chats" title="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <div id="sideMenu" class="menu hidden" role="menu">
            <button type="button" id="menuRefresh" role="menuitem">Refresh</button>
            <button type="button" id="logoutBtn" role="menuitem">Log out</button>
          </div>
        </div>
      </div>
      <div id="authBanner" class="banner danger hidden"></div>
      <div id="chatList"></div>
    </aside>
    <main>
      <div class="thread-head">
        <div>
          <h2 id="threadTitle">Select a chat</h2>
          <div id="threadStatus" class="sub"></div>
        </div>
        <div class="head-actions">
          <button type="button" class="icon-btn" id="threadMenuBtn" aria-label="Chat actions" title="Chat actions">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </button>
          <div id="threadMenu" class="menu hidden" role="menu">
            <button type="button" id="takeoverBtn" role="menuitem" disabled>Take over</button>
            <button type="button" id="releaseBtn" role="menuitem" disabled>Release to bot</button>
          </div>
        </div>
      </div>
      <div id="messages"><div class="empty">Choose a conversation on the left.</div></div>
      <div class="composer">
        <textarea id="replyBox" rows="2" placeholder="Type a message" disabled></textarea>
        <div class="composer-actions">
          <button type="button" class="secondary" id="takeoverBtnBar" disabled>Take over</button>
          <button type="button" class="secondary" id="releaseBtnBar" disabled>Release to bot</button>
          <button type="button" class="grow" id="sendBtn" disabled>Send</button>
        </div>
        <div class="error" id="threadError"></div>
      </div>
    </main>
  </section>

  <script>
    const state = {
      token: sessionStorage.getItem('agentToken') || '',
      selected: null,
      poll: null,
    };

    const el = (id) => document.getElementById(id);

    async function api(path, options = {}) {
      const headers = Object.assign(
        { 'Content-Type': 'application/json' },
        options.headers || {}
      );
      if (state.token) headers.Authorization = 'Bearer ' + state.token;
      const res = await fetch('/agent' + path, { ...options, headers, credentials: 'same-origin' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || res.statusText);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function showApp() {
      el('login').classList.add('hidden');
      el('app').classList.remove('hidden');
      refreshAuthBanner();
      loadChats();
      if (state.poll) clearInterval(state.poll);
      state.poll = setInterval(() => {
        loadChats(true);
        if (state.selected) loadThread(state.selected, true);
        refreshAuthBanner();
      }, 5000);
    }

    async function refreshAuthBanner() {
      const banner = el('authBanner');
      if (!banner) return;
      try {
        const status = await api('/api/status');
        if (status.lastSendError && /401|190|TOKEN|expired|Authentication/i.test(status.lastSendError)) {
          banner.textContent =
            'WhatsApp token auth failed — bot and agent replies cannot send. Update WHATSAPP_TOKEN (and App Secret if signatures fail) on Render, then redeploy.';
          banner.classList.remove('hidden');
        } else if (status.webhookSignatureRejects > 0 && status.lastSendError) {
          banner.textContent = status.lastSendError;
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
          banner.textContent = '';
        }
      } catch (_) {
        /* ignore */
      }
    }

    function showLogin() {
      el('app').classList.add('hidden');
      el('login').classList.remove('hidden');
      if (state.poll) clearInterval(state.poll);
    }

    function closeMenus() {
      el('sideMenu').classList.add('hidden');
      el('threadMenu').classList.add('hidden');
    }

    el('menuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      el('threadMenu').classList.add('hidden');
      el('sideMenu').classList.toggle('hidden');
    });
    el('threadMenuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      el('sideMenu').classList.add('hidden');
      el('threadMenu').classList.toggle('hidden');
    });
    document.addEventListener('click', closeMenus);

    el('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      el('loginError').textContent = '';
      const password = el('password').value;
      try {
        await api('/api/login', { method: 'POST', body: JSON.stringify({ password }) });
        state.token = password;
        sessionStorage.setItem('agentToken', password);
        showApp();
      } catch (err) {
        el('loginError').textContent = err.status === 401 ? 'Wrong password' : (err.message || 'Login failed');
      }
    });

    async function doLogout() {
      closeMenus();
      try { await api('/api/logout', { method: 'POST', body: '{}' }); } catch (_) {}
      state.token = '';
      sessionStorage.removeItem('agentToken');
      showLogin();
    }
    el('logoutBtn').addEventListener('click', doLogout);
    el('menuRefresh').addEventListener('click', () => { closeMenus(); loadChats(); });
    el('refreshBtn').addEventListener('click', () => loadChats());

    async function loadChats(silent) {
      try {
        const data = await api('/api/chats');
        const list = el('chatList');
        if (!data.chats.length) {
          list.innerHTML = '<div class="empty" style="margin:24px auto;">No chats yet. When a customer messages WhatsApp, they appear here.</div>';
          return;
        }
        list.innerHTML = data.chats.map((c) => {
          const active = state.selected === c.waNumber ? 'active' : '';
          const badges = [];
          if (c.agentTakenOver) badges.push('<span class="badge takeover">agent</span>');
          else if (c.status === 'quiet') badges.push('<span class="badge quiet">quiet</span>');
          else if (c.status) badges.push('<span class="badge">' + c.status + '</span>');
          return (
            '<button type="button" class="chat-item ' + active + '" data-wa="' + c.waNumber + '">' +
              '<div class="wa">+' + c.waNumber + badges.join('') + '</div>' +
              '<div class="preview">' + escapeHtml(c.lastText || '') + '</div>' +
            '</button>'
          );
        }).join('');
        list.querySelectorAll('.chat-item').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.selected = btn.getAttribute('data-wa');
            loadChats(true);
            loadThread(state.selected);
          });
        });
      } catch (err) {
        if (!silent) el('threadError').textContent = err.message;
        if (err.status === 401) showLogin();
      }
    }

    function setThreadActionsEnabled(on) {
      el('replyBox').disabled = !on;
      el('sendBtn').disabled = !on;
      el('takeoverBtn').disabled = !on;
      el('releaseBtn').disabled = !on;
      el('takeoverBtnBar').disabled = !on;
      el('releaseBtnBar').disabled = !on;
    }

    async function loadThread(wa, silent) {
      el('threadError').textContent = '';
      try {
        const data = await api('/api/chats/' + encodeURIComponent(wa));
        el('threadTitle').textContent = '+' + wa;
        const s = data.session;
        el('threadStatus').textContent = s
          ? ('Status: ' + s.status + (s.agentTakenOver ? ' · agent takeover' : '') + (s.currentState ? ' · ' + s.currentState : ''))
          : 'No bot session yet';
        setThreadActionsEnabled(true);

        const box = el('messages');
        if (!data.messages.length) {
          box.innerHTML = '<div class="empty">No messages stored for this number yet.</div>';
          return;
        }
        const stickBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
        box.innerHTML = data.messages.map((m) => {
          const cls = m.direction === 'in' ? 'in' : (m.source === 'agent' ? 'out-agent' : 'out-bot');
          const who = m.direction === 'in' ? 'Customer' : (m.source === 'agent' ? 'Agent' : 'Bot');
          return (
            '<div class="bubble ' + cls + '">' +
              escapeHtml(m.text || '') +
              '<span class="meta">' + who + ' · ' + escapeHtml(m.at || '') + '</span>' +
            '</div>'
          );
        }).join('');
        if (!silent || stickBottom) box.scrollTop = box.scrollHeight;
      } catch (err) {
        if (!silent) el('threadError').textContent = err.message;
        if (err.status === 401) showLogin();
      }
    }

    el('sendBtn').addEventListener('click', async () => {
      const text = el('replyBox').value.trim();
      if (!state.selected || !text) return;
      el('threadError').textContent = '';
      el('sendBtn').disabled = true;
      try {
        await api('/api/chats/' + encodeURIComponent(state.selected) + '/reply', {
          method: 'POST',
          body: JSON.stringify({ text }),
        });
        el('replyBox').value = '';
        await loadThread(state.selected);
        await loadChats(true);
      } catch (err) {
        el('threadError').textContent = err.data && err.data.error ? err.data.error : err.message;
      } finally {
        el('sendBtn').disabled = false;
      }
    });

    async function doTakeover() {
      closeMenus();
      if (!state.selected) return;
      try {
        await api('/api/chats/' + encodeURIComponent(state.selected) + '/takeover', {
          method: 'POST',
          body: '{}',
        });
        await loadThread(state.selected);
        await loadChats(true);
      } catch (err) {
        el('threadError').textContent = err.message;
      }
    }
    async function doRelease() {
      closeMenus();
      if (!state.selected) return;
      try {
        await api('/api/chats/' + encodeURIComponent(state.selected) + '/release', {
          method: 'POST',
          body: '{}',
        });
        await loadThread(state.selected);
        await loadChats(true);
      } catch (err) {
        el('threadError').textContent = err.message;
      }
    }
    el('takeoverBtn').addEventListener('click', doTakeover);
    el('takeoverBtnBar').addEventListener('click', doTakeover);
    el('releaseBtn').addEventListener('click', doRelease);
    el('releaseBtnBar').addEventListener('click', doRelease);

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    (async function boot() {
      try {
        const status = await api('/api/status');
        if (!status.enabled) {
          el('loginError').textContent = 'Agent desk disabled. Set AGENT_DESK_PASSWORD on Render.';
        }
      } catch (_) {}
      if (state.token) {
        try {
          await api('/api/chats');
          showApp();
          return;
        } catch (_) {
          sessionStorage.removeItem('agentToken');
          state.token = '';
        }
      }
      showLogin();
    })();
  </script>
</body>
</html>
